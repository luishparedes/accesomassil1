<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Acceso Premium | Sistema Exclusivo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== ESTILOS ORIGINALES (INTACTOS) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        #client-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .container h1 {
            margin-bottom: 1.5rem;
            color: #2c3e50;
            font-size: 1.8rem;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fff;
        }
        
        input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        
        input[type="text"] {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
        }
        
        button {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4);
        }
        
        .error { 
            color: #e74c3c; 
            background: #ffeaea;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid #e74c3c;
            margin-top: 10px;
        }
        
        .info { 
            color: #3498db; 
            background: #ebf5fb;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid #3498db;
            margin: 15px 0;
            text-align: left;
        }
        
        /* Anti-selección y anti-copia visual (adicional) */
        body, .container, input, button {
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Permite seleccionar solo el input por si el usuario necesita copiar/pegar su código */
        input {
            user-select: text;
            -webkit-user-select: text;
        }
    </style>
</head>
<body>

<div id="client-container">
    <div class="container">
        <h1><i class="fas fa-shield-alt"></i> Acceso al Sistema</h1>
        <form id="access-form">
            <input 
                type="text" 
                id="code" 
                placeholder="Ej: A1B2" 
                required
                autocomplete="off"
            >
            <button type="submit" id="submit-btn">
                <i class="fas fa-lock"></i> INGRESAR
            </button>
        </form>
        <p id="message"></p>

        <div class="info">
            <p style="font-size: 1.1rem; margin-bottom: 10px;"><i class="fas fa-info-circle"></i> <strong>Información importante</strong></p>
            <ul style="padding-left: 20px; font-size: 0.9rem;">
                <li style="margin-bottom: 6px;">💾 <strong>Almacenamiento local:</strong> Los datos se guardan en su navegador actual.</li>
                <li style="margin-bottom: 6px;">🔄 <strong>Respaldo de datos:</strong> Se recomienda realizar copias periódicas.</li>
                <li style="margin-bottom: 6px;">⚠️ <strong>Uso del código:</strong> Cada código es de uso personal y exclusivo.</li>
            </ul>
        </div>
        
        <div class="info" style="text-align: center;">
            <p><strong>Horario:</strong> 0:00 AM - 0:00 PM</p>
            <p><strong>Contacto:</strong> </p>
        </div>
    </div>
</div>

            },
